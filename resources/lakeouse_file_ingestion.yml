resources:
  jobs:
    weather_hourly_ingestion_job:
      name: "weather api - file ingestion"
      schedule:
        quartz_cron_expression: "0 0 23 * * ?"
        timezone_id: "America/Recife"
        pause_status: "UNPAUSED"
        
      tasks:
        - task_key: camada_ingestao
          spark_python_task: 
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_file_ingestion.py
          environment_key: default
        
        - task_key: camada_bronze
          depends_on:
            - task_key: camada_ingestao
          spark_python_task:
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_bronze.py
          environment_key: default
        
        - task_key: camada_silver
          description: "Limpa, deduplica e padroniza dados em workspace.default.weather_data_silver"
          depends_on:
            - task_key: camada_bronze
          spark_python_task:
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_silver.py
          environment_key: default


        - task_key: camada_gold
          description: "Gera agregações diárias por cidade em workspace.default.weather_data_gold"
          depends_on:
            - task_key: camada_silver
          spark_python_task:
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_gold.py
          environment_key: default

        - task_key: camada_gold_weekly
          description: "Gera agregações semanais por cidade em workspace.default.weather_data_gold_weekly"
          depends_on:
            - task_key: camada_silver
          spark_python_task:
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_gold_weekly.py
          environment_key: default

        - task_key: camada_gold_monthly
          description: "Gera agregações mensais por cidade em workspace.default.weather_data_gold_monthly"
          depends_on:
            - task_key: camada_silver
          spark_python_task:
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_gold_monthly.py
          environment_key: default

        - task_key: camada_gold_alerts_daily
          description: "Gera indicadores e alertas diários de extremos climáticos em workspace.default.weather_data_gold_alerts_daily"
          depends_on:
            - task_key: camada_silver
          spark_python_task:
            python_file: ../src/weather_lakehouse_etl/extractions/open_meteo_gold_alerts_daily.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
            dependencies:
              - ../dist/*.whl