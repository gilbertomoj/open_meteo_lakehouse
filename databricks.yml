bundle:
  name: weather_lakehouse
  uuid: 374602a3-db46-4e2b-8e48-6d9f687995d3

include:
  - resources/*.yml

artifacts:
  python_artifact:
    type: whl
    build: uv build --wheel

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    mode: development
    default: true
    workspace:
      profile: DEFAULT
      host: https://dbc-ae49e2ce-485b.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      profile: DEFAULT
      host: https://dbc-ae49e2ce-485b.cloud.databricks.com
      root_path: /Workspace/Users/gibamedeirosgc@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: gibamedeirosgc@gmail.com
        level: CAN_MANAGE
